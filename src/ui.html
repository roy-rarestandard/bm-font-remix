<!doctype html>
<!-- impeccable-disable overused-font, flat-type-hierarchy -- Native Figma plugin typography uses Inter and a compact 10/11/12px control hierarchy. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BM FontMixer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1f1f1f;
        --surface: #242424;
        --field: #2b2b2b;
        --field-hover: #343434;
        --border: #404040;
        --text: #f5f5f5;
        --muted: #a6a6a6;
        --focus: #a9b9f3;
        --accent: #a9b9f3;
        --apply: #ff5b35;
        --apply-hover: #ff704f;
        --error: #ff806c;
        --success: #65dca9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 0;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        line-height: 1.4;
      }

      button,
      input {
        min-width: 0;
        font: inherit;
      }

      button {
        border: 1px solid transparent;
        border-radius: 7px;
        background: var(--field);
        color: var(--text);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      }

      button:hover:not(:disabled) {
        background: var(--field-hover);
      }

      button:focus-visible,
      input:focus-visible {
        border-color: var(--focus);
        outline: 2px solid rgba(169, 185, 243, 0.25);
        outline-offset: 1px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.35;
      }

      .app {
        display: flex;
        flex-direction: column;
      }

      .content {
        padding: 16px 14px 40px;
      }

      .section + .section {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }

      .section-heading {
        margin: 0 0 9px;
        font-size: 12px;
        font-weight: 650;
      }

      .weight-control {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
        border-radius: 9px;
        background: #292929;
      }

      .weight-button {
        min-height: 34px;
        padding: 6px 3px;
        border-radius: 7px;
        background: transparent;
        font-size: 10px;
        font-weight: 550;
        letter-spacing: -0.01em;
      }

      .weight-button[aria-checked="true"] {
        background: var(--accent);
        color: #171717;
        font-weight: 700;
      }

      .weight-button[aria-checked="true"]:hover:not(:disabled) {
        background: #bdc8f4;
      }

      .size-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      .number-combobox {
        position: relative;
        display: flex;
        min-width: 0;
      }

      .number-input {
        width: 100%;
        height: 34px;
        padding: 7px 54px 7px 9px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: var(--field);
        color: var(--text);
        font-variant-numeric: tabular-nums;
        transition: background 120ms ease, border-color 120ms ease;
        appearance: textfield;
      }

      .number-input::-webkit-outer-spin-button,
      .number-input::-webkit-inner-spin-button {
        margin: 0;
        appearance: none;
      }

      .number-input:hover {
        background: var(--field-hover);
      }

      .unit {
        position: absolute;
        top: 50%;
        right: 31px;
        transform: translateY(-50%);
        color: #909090;
        font-size: 10px;
        line-height: 1;
        pointer-events: none;
      }

      .number-trigger {
        position: absolute;
        top: 0;
        right: 0;
        width: 28px;
        height: 34px;
        padding: 0;
        border-radius: 0 7px 7px 0;
        background: transparent;
        color: var(--muted);
      }

      .number-trigger svg {
        width: 12px;
        height: 12px;
        transition: transform 120ms ease;
      }

      .number-trigger[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }

      .number-menu {
        position: fixed;
        z-index: 50;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #252525;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.46);
        scrollbar-color: #555 transparent;
        scrollbar-width: thin;
      }

      .number-option {
        display: grid;
        width: 100%;
        min-height: 28px;
        grid-template-columns: 14px minmax(0, 1fr);
        align-items: center;
        gap: 5px;
        padding: 5px 7px;
        border-radius: 6px;
        background: transparent;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }

      .number-option:hover,
      .number-option.active {
        background: var(--field-hover);
      }

      .check {
        opacity: 0;
      }

      .number-option[aria-selected="true"] .check {
        opacity: 1;
      }

      .footer {
        padding: 10px 14px 12px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .status {
        min-height: 34px;
        max-height: 34px;
        margin-bottom: 6px;
        overflow: hidden;
        color: #d0d0d0;
        line-height: 1.35;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }

      .apply-button {
        width: 100%;
        min-height: 44px;
        background: var(--apply);
        color: #171717;
        font-weight: 700;
      }

      .apply-button:hover:not(:disabled) {
        background: var(--apply-hover);
      }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <main class="content">
        <section class="section" aria-labelledby="weightHeading">
          <h1 id="weightHeading" class="section-heading">Weight</h1>
          <div id="weightControl" class="weight-control" role="radiogroup" aria-label="Font weight pairing">
            <button class="weight-button" type="button" role="radio" data-weight="regular" aria-checked="true" tabindex="0">Regular</button>
            <button class="weight-button" type="button" role="radio" data-weight="semibold" aria-checked="false" tabindex="-1">SemiBold</button>
            <button class="weight-button" type="button" role="radio" data-weight="bold" aria-checked="false" tabindex="-1">Bold</button>
            <button class="weight-button" type="button" role="radio" data-weight="extrabold" aria-checked="false" tabindex="-1">ExtraBold</button>
          </div>
        </section>

        <section class="section">
          <div class="size-grid">
            <div>
              <label class="field-label" for="fontSizeInput">Font size</label>
              <div class="number-combobox">
                <input id="fontSizeInput" class="number-input" type="number" value="40" min="1" max="420" step="1" inputmode="decimal" />
                <span class="unit">px</span>
                <button id="fontSizeTrigger" class="number-trigger" type="button" aria-label="Choose font size" aria-haspopup="listbox" aria-expanded="false">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4.5 6 3.5 3.5L11.5 6" /></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="field-label" for="sizeRatioInput">Size difference</label>
              <div class="number-combobox">
                <input id="sizeRatioInput" class="number-input" type="number" value="-5" min="-30" max="30" step="1" inputmode="decimal" />
                <span class="unit">%</span>
                <button id="sizeRatioTrigger" class="number-trigger" type="button" aria-label="Choose size difference" aria-haspopup="listbox" aria-expanded="false">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4.5 6 3.5 3.5L11.5 6" /></svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div id="status" class="status" role="status" aria-live="polite">Loading required fonts…</div>
        <button id="applyButton" class="apply-button" type="button" disabled>Apply</button>
      </footer>
    </div>

    <script>
      const FONT_SIZE_PRESETS = [10, 11, 12, 13, 14, 15, 16, 20, 24, 32, 36, 40, 48, 64, 72, 96];
      const SIZE_DIFFERENCE_PRESETS = [-30, -25, -20, -15, -10, -8, -5, 0, 5, 10, 15, 20, 25, 30];
      const DEFAULTS = { weight: "regular", fontSize: 40, sizeRatio: -5 };
      const state = { weights: [], selectedWeight: DEFAULTS.weight, openMenu: null };

      const app = document.getElementById("app");
      const status = document.getElementById("status");
      const applyButton = document.getElementById("applyButton");
      const weightButtons = Array.from(document.querySelectorAll(".weight-button"));
      const fontSizeInput = document.getElementById("fontSizeInput");
      const sizeRatioInput = document.getElementById("sizeRatioInput");

      function post(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      function setStatus(message, kind = "info") {
        status.textContent = message;
        status.className = `status ${kind}`;
      }

      function requestResize() {
        requestAnimationFrame(() => {
          post({ type: "resize-ui", height: Math.ceil(app.getBoundingClientRect().height) });
        });
      }

      function getWeight(id) {
        return state.weights.find((weight) => weight.id === id);
      }

      function selectWeight(id, focus = false) {
        const weight = getWeight(id);
        if (!weight || !weight.available) return;
        state.selectedWeight = id;
        weightButtons.forEach((button) => {
          const selected = button.dataset.weight === id;
          button.setAttribute("aria-checked", String(selected));
          button.tabIndex = selected ? 0 : -1;
          if (selected && focus) button.focus();
        });
      }

      function renderWeights() {
        weightButtons.forEach((button) => {
          const weight = getWeight(button.dataset.weight);
          button.disabled = !weight || !weight.available;
          button.title = weight
            ? weight.available
              ? `${weight.fontA.family} ${weight.fontA.style} + ${weight.fontB.family} ${weight.fontB.style}`
              : `Missing: ${weight.missing.join(", ")}`
            : "Checking fonts…";
        });

        const preferred = getWeight(state.selectedWeight);
        const fallback = state.weights.find((weight) => weight.available);
        if (!preferred || !preferred.available) state.selectedWeight = fallback?.id ?? DEFAULTS.weight;
        selectWeight(state.selectedWeight);
        applyButton.disabled = !fallback;

        if (!fallback) {
          const missing = state.weights.flatMap((weight) => weight.missing || []);
          setStatus(`Required fonts are missing: ${Array.from(new Set(missing)).join(", ")}.`, "error");
        }
      }

      function availableWeightButtons() {
        return weightButtons.filter((button) => !button.disabled);
      }

      weightButtons.forEach((button) => {
        button.addEventListener("click", () => selectWeight(button.dataset.weight));
        button.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
          event.preventDefault();
          const available = availableWeightButtons();
          const current = available.indexOf(button);
          const direction = event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 1;
          const next = available[(current + direction + available.length) % available.length];
          if (next) selectWeight(next.dataset.weight, true);
        });
      });

      function closeNumberMenu() {
        if (!state.openMenu) return;
        state.openMenu.menu.remove();
        state.openMenu.trigger.setAttribute("aria-expanded", "false");
        state.openMenu = null;
      }

      function createNumberPicker(input, trigger, values) {
        function choose(value) {
          input.value = String(value);
          input.dispatchEvent(new Event("change", { bubbles: true }));
          closeNumberMenu();
          input.focus();
        }

        function openMenu() {
          if (state.openMenu?.trigger === trigger) return closeNumberMenu();
          closeNumberMenu();
          const menu = document.createElement("div");
          menu.className = "number-menu";
          menu.setAttribute("role", "listbox");
          const current = Number(input.value);

          values.forEach((value) => {
            const option = document.createElement("button");
            const selected = value === current;
            option.type = "button";
            option.className = `number-option${selected ? " active" : ""}`;
            option.setAttribute("role", "option");
            option.setAttribute("aria-selected", String(selected));
            option.innerHTML = `<span class="check">✓</span><span>${value}</span>`;
            option.addEventListener("click", () => choose(value));
            menu.appendChild(option);
          });

          document.body.appendChild(menu);
          const rect = input.getBoundingClientRect();
          const below = window.innerHeight - rect.bottom - 8;
          const above = rect.top - 8;
          const openBelow = below >= 140 || below >= above;
          menu.style.left = `${Math.round(rect.left)}px`;
          menu.style.width = `${Math.round(rect.width)}px`;
          menu.style.maxHeight = `${Math.max(112, Math.floor(openBelow ? below : above))}px`;
          if (openBelow) menu.style.top = `${Math.round(rect.bottom + 4)}px`;
          else menu.style.bottom = `${Math.round(window.innerHeight - rect.top + 4)}px`;

          trigger.setAttribute("aria-expanded", "true");
          state.openMenu = { menu, trigger };
          menu.querySelector(".active")?.scrollIntoView({ block: "nearest" });
        }

        trigger.addEventListener("click", (event) => {
          event.stopPropagation();
          openMenu();
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" && event.altKey) {
            event.preventDefault();
            openMenu();
          } else if (event.key === "Escape") closeNumberMenu();
        });
      }

      createNumberPicker(fontSizeInput, document.getElementById("fontSizeTrigger"), FONT_SIZE_PRESETS);
      createNumberPicker(sizeRatioInput, document.getElementById("sizeRatioTrigger"), SIZE_DIFFERENCE_PRESETS);
      document.addEventListener("pointerdown", (event) => {
        if (state.openMenu && !state.openMenu.menu.contains(event.target) && event.target !== state.openMenu.trigger) closeNumberMenu();
      });

      function readNumber(input, label, min, max) {
        const value = Number(input.value);
        if (!Number.isFinite(value)) throw new Error(`${label} must be a number.`);
        if (value < min || value > max) throw new Error(`${label} must be between ${min} and ${max}.`);
        return value;
      }

      applyButton.addEventListener("click", () => {
        try {
          const selected = getWeight(state.selectedWeight);
          if (!selected?.available) throw new Error("Choose an available weight.");
          const fontSize = readNumber(fontSizeInput, "Font size", 1, 420);
          const sizeRatio = readNumber(sizeRatioInput, "Size difference", -30, 30);
          applyButton.disabled = true;
          setStatus("Applying font mix…");
          post({ type: "apply", weight: state.selectedWeight, fontSize, sizeRatio });
        } catch (error) {
          setStatus(error.message || "Check the entered values.", "error");
        }
      });

      window.onmessage = (event) => {
        const message = event.data?.pluginMessage;
        if (!message) return;
        if (message.type === "init") {
          state.weights = Array.isArray(message.weights) ? message.weights : [];
          state.selectedWeight = message.savedSettings?.weight || DEFAULTS.weight;
          fontSizeInput.value = String(message.savedSettings?.fontSize ?? DEFAULTS.fontSize);
          sizeRatioInput.value = String(message.savedSettings?.sizeRatio ?? DEFAULTS.sizeRatio);
          renderWeights();
          if (state.weights.some((weight) => weight.available)) setStatus(message.selectionInfo?.message || "Choose one text node.");
          requestResize();
        } else if (message.type === "status") {
          setStatus(message.message, message.kind);
          applyButton.disabled = !state.weights.some((weight) => weight.available);
        } else if (message.type === "selection-info") {
          setStatus(message.message || "Choose one text node.");
        }
      };

      if (typeof ResizeObserver !== "undefined") new ResizeObserver(requestResize).observe(app);
      post({ type: "init" });
      requestResize();
    </script>
  </body>
</html>
